<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FDC468"/>
      <stop offset="0.3" stop-color="#DF4996"/>
      <stop offset="0.7" stop-color="#BC2FAE"/>
      <stop offset="1" stop-color="#7B39C7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0.5" y1="0" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="white" stop-opacity="0.45"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <!-- Gloss overlay -->
  <rect width="1024" height="512" rx="180" fill="url(#gloss)"/>
  <!-- Camera body (rounded square) -->
  <rect x="232" y="232" width="560" height="560" rx="120" fill="none" stroke="white" stroke-width="52"/>
  <!-- Lens circle -->
  <circle cx="512" cy="512" r="160" fill="none" stroke="white" stroke-width="48"/>
  <!-- Flash dot -->
  <circle cx="700" cy="324" r="42" fill="white"/>
</svg>
